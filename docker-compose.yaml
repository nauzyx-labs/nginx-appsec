# docker-compose.yaml — open-appsec NPM (nginx-proxy-manager + WAF) using named volumes.
#
# Two services:
#   - appsec-npm:  the NPM image built from this repo (ghcr.io/nauzyx-labs/nginx-appsec),
#                  exposing the admin UI (81), public HTTP (80) and HTTPS (443).
#   - appsec-agent: the open-appsec agent sidecar that actually enforces WAF protection.
#                   Shares the NPM container's network + ipc and the shared appsec paths.
#
# All persistent state lives in named Docker volumes (no bind mounts), so the stack
# is self-contained and portable. Pull and run with:
#   docker compose up -d
#
# First-run admin login (at http://localhost:81): admin@example.com / changeme — the
# image prompts to set a real email + password on first sign-in.
#
# NOTE: set AGENT_USER_EMAIL below (or via a .env file / shell env) before going live;
# the agent uses it to register with the open-appsec backend.

services:
  appsec-npm:
    image: ghcr.io/nauzyx-labs/nginx-appsec:2.16.0-appsec.1
    container_name: appsec-npm
    ipc: host
    restart: unless-stopped
    ports:
      - "80:80"    # Public HTTP
      - "443:443"  # Public HTTPS
      - "81:81"   # Admin Web UI
    volumes:
      # NPM state: SQLite DB, nginx config, custom SSL, keys, etc.
      # The image fatals if /data is not mounted.
      - npm_data:/data
      # Let's Encrypt certificates and ACME state.
      - npm_letsencrypt:/etc/letsencrypt
      # Shared with the agent: the local policy YAML the NPM UI edits, and the
      # WAF event logs the UI surfaces in the open-appsec log page.
      - appsec_localconfig:/ext/appsec
      - appsec_logs:/ext/appsec-logs
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  appsec-agent:
    image: ghcr.io/openappsec/agent:latest
    container_name: appsec-agent
    # Share the NPM container's network stack so the agent can talk to nginx and
    # intercept traffic on the same loopback.
    network_mode: service:appsec-npm
    ipc: host
    restart: unless-stopped
    environment:
      # Register the agent with this email — change it to your own before going live.
      - user_email=${AGENT_USER_EMAIL:-user@email.com}
      - nginxproxymanager=true
      - autoPolicyLoad=true
    volumes:
      # Agent config + data (registration, learned state).
      - appsec_config:/etc/cp/conf
      - appsec_data:/etc/cp/data
      # WAF agent logs (separate from the NPM-facing appsec-logs).
      - appsec_agent_logs:/var/log/nano_agent
      # Shared with NPM: same local policy the NPM UI writes, so the agent loads it.
      - appsec_localconfig:/ext/appsec
      - appsec_logs:/ext/appsec-logs
    command: /cp-nano-agent --standalone
    depends_on:
      appsec-npm:
        condition: service_healthy

volumes:
  npm_data:
  npm_letsencrypt:
  appsec_localconfig:
  appsec_logs:
  appsec_config:
  appsec_data:
  appsec_agent_logs:
